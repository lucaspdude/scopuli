# Publishes Docker image to ghcr.io and CLI binaries to the GitHub release
# when a release is published. Triggered by `.github/workflows/release-on-merge.yml`.
#
# Required permissions (set at the workflow level):
#   contents: write   — to upload release assets
#   packages: write   — to push to ghcr.io
#
# Both use the default GITHUB_TOKEN; no PAT required.

name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/scopuli

jobs:
  # ----------------------------------------------------------------
  # Multi-arch Docker image → ghcr.io/<owner>/scopuli:<tag> + :latest
  # ----------------------------------------------------------------
  docker:
    name: docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=scopuli
            org.opencontainers.image.description=Self-hosted credential vault for sharing scoped secrets with agents and humans
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

  # ----------------------------------------------------------------
  # CLI binaries for macOS + Linux (amd64 + arm64)
  # Each row uses a native runner so CGO/SQLCipher builds without a
  # cross-compiler toolchain.
  # ----------------------------------------------------------------
  binaries:
    name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: scopuli-linux-amd64
          - runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            asset_name: scopuli-linux-arm64
          - runs-on: macos-13
            goos: darwin
            goarch: amd64
            asset_name: scopuli-darwin-amd64
          - runs-on: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: scopuli-darwin-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install CGO build deps (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          set -e
          mkdir -p bin
          go build -tags sqlite_fts5 \
            -trimpath -buildvcs=true \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" \
            -o bin/${{ matrix.asset_name }} \
            ./cmd/scopuli

      - name: Package + checksum
        run: |
          set -e
          cd bin
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}
          sha256sum ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/${{ matrix.asset_name }}.tar.gz
            bin/${{ matrix.asset_name }}.tar.gz.sha256
          fail_on_unmatched_files: true
